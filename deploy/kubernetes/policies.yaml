apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/component: frontend}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/component: frontend-proxy}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend-proxy
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: frontend-proxy}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
